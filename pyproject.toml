[project]
name = "acquirer-id"
version = "0.1.0"
description = "Ranks likely acquirers for a target company from a CSV of precedent M&A deals and drafts a rationale for each."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
acquirer-id = "acquirer_id.cli:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquirer_id"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
